<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Frontend Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .primary-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .secondary-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .secondary-btn:hover {
            background: #e0e0e0;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Welcome!</h1>
        <p>This is a simple frontend page running on a local server. Click the buttons below to interact with the page.</p>

        <div class="button-group">
            <button class="primary-btn" onclick="showMessage('success', 'Button clicked! 🎉')">Click Me</button>
            <button class="secondary-btn" onclick="showMessage('info', 'This is an info message!')">Info</button>
            <button class="secondary-btn" onclick="clearMessage()">Clear</button>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        function showMessage(type, text) {
            const msgElement = document.getElementById('message');
            msgElement.textContent = text;
            msgElement.className = `message show ${type}`;
        }

        function clearMessage() {
            const msgElement = document.getElementById('message');
            msgElement.className = 'message';
        }

        console.log('Frontend page loaded successfully! ✅');
    </script>
</body>
</html>
