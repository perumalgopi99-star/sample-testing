<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .items-list {
            margin-top: 30px;
        }
        
        .item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .item span {
            color: #333;
        }
        
        .remove-btn {
            background: #ff6b6b;
            padding: 6px 12px;
            font-size: 12px;
        }
        
        .remove-btn:hover {
            background: #ff5252;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Simple App</h1>
        <p class="subtitle">Add items and manage them with this simple frontend</p>
        
        <div class="input-group">
            <input type="text" id="itemInput" placeholder="Type something..." />
            <button onclick="addItem()">Add</button>
        </div>
        
        <div class="items-list">
            <div id="itemsContainer" class="empty-state">
                No items yet. Add one above!
            </div>
        </div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('items')) || [];

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">No items yet. Add one above!</div>';
                return;
            }
            
            container.innerHTML = items.map((item, index) => `
                <div class="item">
                    <span>${item}</span>
                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                </div>
            `).join('');
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const value = input.value.trim();
            
            if (value === '') {
                alert('Please enter something!');
                return;
            }
            
            items.push(value);
            localStorage.setItem('items', JSON.stringify(items));
            input.value = '';
            renderItems();
        }

        function removeItem(index) {
            items.splice(index, 1);
            localStorage.setItem('items', JSON.stringify(items));
            renderItems();
        }

        // Allow Enter key to add items
        document.getElementById('itemInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        // Initial render
        renderItems();
    </script>
</body>
</html>
