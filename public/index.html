<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App - Sample</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 2em;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 0.9em;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1em;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .todo-item:hover {
      background: #f0f1f3;
      transform: translateX(4px);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 12px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      color: #333;
      word-break: break-word;
    }

    .btn-delete {
      background: #ff6b6b;
      padding: 8px 12px;
      font-size: 0.85em;
      border-radius: 6px;
    }

    .btn-delete:hover {
      box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }

    .empty-state-icon {
      font-size: 3em;
      margin-bottom: 10px;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9em;
      color: #999;
    }

    .status.loading {
      color: #667eea;
    }

    .error {
      background: #ffe0e0;
      color: #c92a2a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    .error.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✓ Todo App</h1>
    <p class="subtitle">A modern sample application</p>

    <div class="error" id="errorMessage"></div>

    <div class="input-group">
      <input
        type="text"
        id="todoInput"
        placeholder="Add a new todo..."
        autocomplete="off"
      />
      <button onclick="addTodo()">Add</button>
    </div>

    <ul class="todo-list" id="todoList"></ul>

    <div class="empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon">📝</div>
      <p>No todos yet. Create one to get started!</p>
    </div>

    <div class="status" id="status">Loading todos...</div>
  </div>

  <script>
    const API_BASE = '/api';

    async function fetchTodos() {
      try {
        const response = await fetch(`${API_BASE}/todos`);
        if (!response.ok) throw new Error('Failed to fetch todos');
        const todos = await response.json();
        renderTodos(todos);
        updateStatus(`${todos.length} todo${todos.length !== 1 ? 's' : ''}`);
      } catch (error) {
        showError('Failed to load todos: ' + error.message);
      }
    }

    async function addTodo() {
      const input = document.getElementById('todoInput');
      const title = input.value.trim();

      if (!title) {
        showError('Please enter a todo title');
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/todos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });

        if (!response.ok) throw new Error('Failed to add todo');

        input.value = '';
        fetchTodos();
      } catch (error) {
        showError('Failed to add todo: ' + error.message);
      }
    }

    async function toggleTodo(id, completed) {
      try {
        const response = await fetch(`${API_BASE}/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: !completed })
        });

        if (!response.ok) throw new Error('Failed to update todo');

        fetchTodos();
      } catch (error) {
        showError('Failed to update todo: ' + error.message);
      }
    }

    async function deleteTodo(id) {
      try {
        const response = await fetch(`${API_BASE}/todos/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) throw new Error('Failed to delete todo');

        fetchTodos();
      } catch (error) {
        showError('Failed to delete todo: ' + error.message);
      }
    }

    function renderTodos(todos) {
      const todoList = document.getElementById('todoList');
      const emptyState = document.getElementById('emptyState');

      if (todos.length === 0) {
        todoList.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      todoList.innerHTML = todos
        .map(
          todo => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}">
          <input
            type="checkbox"
            ${todo.completed ? 'checked' : ''}
            onchange="toggleTodo(${todo.id}, ${todo.completed})"
          />
          <span class="todo-text">${escapeHtml(todo.title)}</span>
          <button class="btn-delete" onclick="deleteTodo(${todo.id})">Delete</button>
        </li>
      `
        )
        .join('');
    }

    function updateStatus(message) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.classList.remove('loading');
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      setTimeout(() => {
        errorDiv.classList.remove('show');
      }, 5000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Enter key to add todo
    document.getElementById('todoInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addTodo();
      }
    });

    // Load todos on page load
    fetchTodos();
  </script>
</body>
</html>
