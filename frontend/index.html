<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Frontend</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome! 👋</h1>
        <p>This is a simple frontend page running on a local server. Click the buttons below to interact.</p>
        
        <div class="button-group">
            <button class="btn-primary" onclick="showMessage()">Click Me!</button>
            <button class="btn-secondary" onclick="resetMessage()">Reset</button>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        const messages = [
            '🎉 Great! You clicked the button!',
            '💪 Awesome job clicking again!',
            '🚀 You are on fire!',
            '⭐ Keep it up, superstar!',
            '🎯 Perfect timing!'
        ];
        
        let clickCount = 0;
        
        function showMessage() {
            const messageEl = document.getElementById('message');
            clickCount++;
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            messageEl.textContent = `${randomMessage} (${clickCount} clicks)`;
            messageEl.className = 'message show success';
        }
        
        function resetMessage() {
            const messageEl = document.getElementById('message');
            messageEl.className = 'message';
            clickCount = 0;
        }
    </script>
</body>
</html>
